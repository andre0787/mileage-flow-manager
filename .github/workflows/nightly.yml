name: Nightly — Full Check

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Rodar e2e completo (desativado na cron — ver job e2e-full)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  quality-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # GITHUB_TOKEN é read-only em cron; create-pull-request precisa de push
      pull-requests: write # e criar o PR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check (fast + build + budget)
        run: npm run check:pr

      - name: Quality write
        run: npm run quality:write

      - name: Disable pre-commit hooks (bot commit — pre-pr não roda no CI)
        run: mkdir -p /tmp/no-hooks && git config core.hooksPath /tmp/no-hooks

      - name: Create PR with QUALITY.md update
        # continue-on-error: a setting do repo "Allow GitHub Actions to create and
        # approve pull requests" está desativada (Settings → Actions → General).
        # Ativar na UI reativa o PR automático; enquanto isso, o job não falha.
        if: always()
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: atualiza QUALITY.md (nightly)"
          title: "📊 Atualização noturna QUALITY.md"
          body: |
            Atualização automática das métricas de qualidade.
            Gerado pelo workflow nightly (jobs paralelos check + e2e).
          branch: chore/quality-nightly-update
          delete-branch: true
          labels: automated, docs
          add-paths: QUALITY.md

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: docs/reports/

  e2e-full:
    # Sanitização 07/08: fora da cron. O e2e completo (62 testes) contra o Supabase
    # REAL compartilhado falha todas as noites por rate-limit do IP do runner do
    # GitHub (evidência: save retry 0-4 = 5 rejeições seguidas; não reproduz local).
    # Disponível manualmente via workflow_dispatch com run-e2e=true.
    if: github.event_name == 'workflow_dispatch' && inputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: E2E completo
        # workers=1: serial — evita contenção (CPU/rate-limit Supabase) que gerava
        # flakiness intermitente em testes diferentes a cada run
        run: npm run test:e2e -- --workers=1

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: playwright-report/

      - name: Upload E2E test-results (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: warn
