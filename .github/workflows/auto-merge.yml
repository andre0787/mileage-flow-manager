name: Auto Merge

on:
  workflow_run:
    workflows: ["CI PR Check"]
    types: [completed]
  repository_dispatch:
    types: [pr-ready]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # ── Fluxo normal (run de push humano com jobs reais) ────────────────
  # workflow_run dispara quando um run do CI completa (success/failure).
  # O run do head final (push humano) completa success → merge.
  auto-merge:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Find open PR for branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "🔍 Buscando PR aberto da branch: $BRANCH"
          PR_NUM=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number \
            -q '.[0].number' 2>/dev/null || echo "")
          echo "num=${PR_NUM:-}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Merge PR
        if: steps.pr.outputs.num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.num }}"
          BRANCH="${{ steps.pr.outputs.branch }}"
          echo "🔀 Mergindo PR #${PR_NUM} (branch: ${BRANCH})"
          # O workflow_run dispara quando o run completa, mas os status checks
          # do head podem não estar registrados ainda (race com a branch
          # protection) — retry com backoff resolve.
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR_NUM" \
              --repo "${{ github.repository }}" \
              --merge \
              --delete-branch; then
              echo "✅ PR #${PR_NUM} merged e branch deletada (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i falhou (tentando habilitar auto-merge se houver checks pendentes)..."
            if gh pr merge "$PR_NUM" \
              --repo "${{ github.repository }}" \
              --auto \
              --merge \
              --delete-branch 2>/dev/null; then
              echo "✅ Auto-merge ativado no GitHub para o PR #${PR_NUM}"
              exit 0
            fi
            echo "⏳ Aguardando 15s para a próxima tentativa ($i/6)..."
            sleep 15
          done
          # Última tentativa direta com saída de erro exposta
          gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --merge \
            --delete-branch

      - name: Disparar deploy de produção
        if: steps.pr.outputs.num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Merge feito por GITHUB_TOKEN (bot) não gera evento push → deploy.yml
          # não dispara sozinho. repository_dispatch é o gatilho robusto pós-merge.
          echo "🚀 Disparando repository_dispatch 'deploy'..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="deploy"
          echo "✅ Deploy disparado (repository_dispatch)"

  # ── Fluxo do bot normalize (run fantasma aprovado) ───────────────────
  # O Normalize PR Report pusheia o rename (GITHUB_TOKEN) → o CI nasce
  # 'action_required' com 0 jobs (approval gate p/ runs de GitHub Actions);
  # workflow_run NÃO dispara para esses runs. O normalize então aprova o
  # run via API, aguarda a conclusão e avisa este job via repository_dispatch
  # 'pr-ready' (client_payload.branch) → merge + deploy.
  mergeia-pr-ready:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Find open PR for branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.client_payload.branch }}"
          echo "🔍 Buscando PR aberto da branch: $BRANCH (pr-ready)"
          PR_NUM=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --state open \
            --json number \
            -q '.[0].number' 2>/dev/null || echo "")
          echo "num=${PR_NUM:-}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Merge PR (checks verdes no head do bot)
        if: steps.pr.outputs.num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.num }}"
          BRANCH="${{ steps.pr.outputs.branch }}"
          echo "🔀 Mergindo PR #${PR_NUM} (branch: ${BRANCH})"
          # Mesmo retry do fluxo normal (registro de checks vs branch protection)
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR_NUM" \
              --repo "${{ github.repository }}" \
              --merge \
              --delete-branch; then
              echo "✅ PR #${PR_NUM} merged e branch deletada (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i falhou (tentando habilitar auto-merge se houver checks pendentes)..."
            if gh pr merge "$PR_NUM" \
              --repo "${{ github.repository }}" \
              --auto \
              --merge \
              --delete-branch 2>/dev/null; then
              echo "✅ Auto-merge ativado no GitHub para o PR #${PR_NUM}"
              exit 0
            fi
            echo "⏳ Aguardando 15s para a próxima tentativa ($i/6)..."
            sleep 15
          done
          gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --merge \
            --delete-branch

      - name: Disparar deploy de produção
        if: steps.pr.outputs.num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Disparando repository_dispatch 'deploy'..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type="deploy"
          echo "✅ Deploy disparado (repository_dispatch)"
