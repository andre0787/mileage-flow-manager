name: Deploy

permissions:
  issues: write

on:
  # Disparado pelo auto-merge (repository_dispatch) após merge na main.
  # Push de bot (GITHUB_TOKEN) não gera evento push → deploy só via dispatch
  # evita deploy duplicado e garante produção automática de verdade.
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      auth_phrase:
        description: '🔐 Frase de autorização para deploy manual'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔐 AUTH Gate
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.auth_phrase }}" != "Autorizo o deploy para produção" ]; then
            echo "❌ AUTH DENIED: frase incorreta"
            exit 1
          fi
          echo "✅ AUTH GRANTED — deploy autorizado"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

  e2e-smoke-prod:
    runs-on: ubuntu-latest
    needs: [deploy]
    timeout-minutes: 15
    # Não falha o workflow se smoke falhar — deploy já foi feito
    # O resultado fica visível no GitHub Actions para investigação
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E Smoke contra produção
        id: smoke
        run: npm run test:e2e:prod:smoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || '' }}

      - name: Alerta de falha do smoke de produção
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Smoke de produção falhou após deploy ${{ github.sha }}" \
            --label bug \
            --body "O smoke pós-deploy falhou (evento: ${{ github.event_name }}). Investigar em https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "✅ Issue de alerta criada (smoke-prod)"

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-prod-report
          path: playwright-report/
