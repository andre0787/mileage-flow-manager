name: CI PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  # cancel-in-progress: false (serial) — evita que um push em rajada cancele o
  # run do head final. O run fantasma 'action_required' (0 jobs) do push do bot
  # normalize é um approval gate do GitHub para runs disparados por GitHub
  # Actions — resolvido no auto-merge (aprova via API e mergeia).
  group: ci-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

env:
  CI: true
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mock.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'mock-anon-key' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - '.github/workflows/**'
              - 'scripts/**'

  check-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: PR check
        run: npm run check:pr

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 20
    # Só roda quando o código (src/tests/config/scripts/workflows) mudou;
    # PRs docs-only pulam o smoke sem perder o gate de qualidade.
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-
      - name: Install deps
        run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: E2E Smoke
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ohyplfpcwxzakujjfwdf.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_TpuJ6Mokci012dnOdyMfyA_F0e3dZVs' }}
        run: CI_SMOKE_ONLY=true npx playwright test --grep "Smoke Tests" --reporter=list
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
