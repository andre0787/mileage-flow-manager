name: CI PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  # cancel-in-progress: false (serial) — cancelar o run anterior quando o push
  # do bot normalize chega cria um run fantasma 'action_required' com 0 jobs
  # (race de cancelamento); o run seguinte nunca agenda jobs e o PR fica sem
  # checks verdes no head final — exigindo commit vazio manual para re-disparar.
  # Com serialização, o run do head final executa normalmente.
  group: ci-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - '.github/workflows/**'
              - 'scripts/**'

  check-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: PR check
        run: npm run check:pr

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 20
    # Só roda quando o código (src/tests/config/scripts/workflows) mudou;
    # PRs docs-only pulam o smoke sem perder o gate de qualidade.
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-
      - name: Install deps
        run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: E2E Smoke
        run: CI_SMOKE_ONLY=true npx playwright test --grep "Smoke Tests" --reporter=list
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/